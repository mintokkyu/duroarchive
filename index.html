<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>나는듀로 - b.stage Archive</title>

  <!-- Font giống b.stage (Noto Sans KR) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #c8d0ea;
      --ink: #14151f;
      --sub: #555a78;
      --gold: #d2b983;
      --gray: #8a8d96;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Noto Sans KR", "Segoe UI", Roboto, -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--ink);
      height: 100vh;
      height: 100dvh;
      display: flex;
      justify-content: center;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    body.view-posts { background-color: #fff; }

    button { font-family: inherit; color: inherit; }

    /* ---------- Huy hiệu xác minh ---------- */
    .badge { width: 20px; height: 20px; color: var(--ink); flex-shrink: 0; display: block; }
    .badge.gold { color: var(--gold); }

    /* ---------- MÀN HÌNH CHÍNH ---------- */
    #home-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      padding: 20px;
    }

    .profile-avatar {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #fff;
      margin-bottom: 14px;
      background-color: #222;
    }

    .profile-name {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 22px;
      font-weight: 500;
      line-height: 1.2;
      margin-bottom: 26px;
    }

    .menu-list {
      width: 100%;
      max-width: 308px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .menu-btn {
      height: 50px;
      background: #fff;
      border: none;
      border-radius: 25px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      font-size: 16px;
      font-weight: 700;
      color: var(--ink);
      transition: transform 0.12s ease;
    }
    .menu-btn:hover { transform: translateY(-1px); }
    .menu-btn-left { display: flex; align-items: center; gap: 12px; }
    .menu-icon { width: 26px; height: 26px; color: var(--ink); }
    .menu-chev { width: 18px; height: 18px; color: var(--sub); }

    /* ---------- KHUNG NỘI DUNG ---------- */
    .app-container {
      display: none;
      flex-direction: column;
      width: 100%;
      max-width: 560px;
      height: 100vh;
      height: 100dvh;
      position: relative;
    }
    #pop-screen { background-color: var(--bg); }
    #posts-screen { background-color: #fff; }

    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 56px;
      padding: 6px 10px;
      flex-shrink: 0;
      z-index: 10;
    }
    #pop-screen .app-header { border-bottom: 1px solid rgba(0, 0, 0, 0.06); }

    .header-left, .header-right { display: flex; align-items: center; gap: 4px; min-width: 44px; }
    .header-right { justify-content: flex-end; }

    .icon-btn {
      width: 44px;
      height: 44px;
      border: none;
      background: none;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ink);
      font-size: 17px;
      font-weight: 500;
    }
    .icon-btn:hover { background: rgba(0, 0, 0, 0.06); }
    .icon-btn svg { width: 24px; height: 24px; }
    .icon-btn.back svg { width: 34px; height: 34px; }   /* nút back to hơn */

    .header-title-box { text-align: center; }
    .header-title { font-size: 16px; font-weight: 700; }
    .header-subtitle { font-size: 11px; color: var(--sub); margin-top: 2px; }

    /* ---------- THANH TÌM KIẾM ---------- */
    .search-bar {
      display: none;
      align-items: center;
      gap: 6px;
      padding: 4px 14px 10px;
      flex-shrink: 0;
    }
    .search-field {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 8px;
      height: 42px;
      padding: 0 14px;
      border-radius: 21px;
      background: #f1f2f6;
    }
    #pop-search-bar .search-field { background: rgba(255, 255, 255, 0.75); }
    .search-field svg { width: 20px; height: 20px; color: var(--ink); flex-shrink: 0; }
    .search-field input {
      flex: 1;
      min-width: 0;
      border: none;
      background: none;
      outline: none;
      font-family: inherit;
      font-size: 15px;
      color: var(--ink);
    }

    /* ---------- VÙNG CUỘN ---------- */
    .chat-feed {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 20px 16px 40px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scrollbar-width: thin;
    }
    .empty-note { text-align: center; color: var(--gray); font-size: 14px; padding: 40px 0; }

    /* ---------- TIN NHẮN POP ---------- */
    .date-divider {
      align-self: center;
      background-color: rgba(154, 165, 190, 0.45);
      color: #3f4756;
      font-size: 12px;
      padding: 5px 14px;
      border-radius: 20px;
      margin: 8px 0;
    }
    .msg-group { display: flex; align-items: flex-start; gap: 10px; }
    .msg-avatar {
      width: 40px; height: 40px; border-radius: 50%;
      object-fit: cover; flex-shrink: 0; background-color: #222;
    }
    .msg-content-col { display: flex; flex-direction: column; max-width: 82%; }
    .msg-sender-row { display: flex; align-items: center; gap: 5px; margin-bottom: 6px; }
    .msg-sender-name { font-size: 13px; font-weight: 700; }
    .msg-time { font-size: 11px; color: #5c6577; margin-left: 4px; }
    .msg-bubble {
      background-color: #fff;
      padding: 13px 16px;
      border-radius: 4px 18px 18px 18px;
      font-size: 14.5px;
      line-height: 1.55;
      word-break: break-word;
    }
    .msg-bubble.has-media { width: min(340px, calc(100vw - 100px)); }
    .msg-text { white-space: pre-line; word-break: break-word; }
    .msg-translation {
      margin-top: 8px; padding-top: 8px;
      border-top: 1px dashed #d8dfec;
      color: #4a5568; font-size: 13.5px;
      white-space: pre-line;
      display: none;
    }
    .show-translations .msg-translation { display: block; }
    .msg-group, .date-divider { flex-shrink: 0; }

    /* ---------- MEDIA (khung đen vuông 1:1 giống b.stage) ---------- */
    .media-wrap { width: 100%; margin-top: 16px; }
    .media-box {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      background-color: #000;
      border-radius: 16px;
      overflow: hidden;
    }
    .media-slide {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      opacity: 0;
      pointer-events: none;
    }
    .media-slide.active { opacity: 1; pointer-events: auto; }
    .media-fail {
      display: flex; align-items: center; justify-content: center;
      padding: 16px; text-align: center;
      font-size: 12px; color: #9aa3b5; word-break: break-all;
    }

    /* nút chuyển ảnh: tròn xám đen, mũi tên mảnh */
    .carousel-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 36px;
      height: 36px;
      padding: 0;
      border: none;
      border-radius: 50%;
      background-color: rgba(38, 38, 38, 0.92);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 2;
    }
    .carousel-btn svg { width: 18px; height: 18px; }
    .carousel-btn.prev { left: 12px; }
    .carousel-btn.prev svg { transform: scaleX(-1); }
    .carousel-btn.next { right: 12px; }
    .carousel-btn.hidden { display: none; }

    /* chấm tròn bên dưới: chấm đang chọn màu đen, còn lại xám */
    .carousel-dots { display: flex; justify-content: center; gap: 8px; margin-top: 12px; }
    .carousel-dot {
      width: 6px; height: 6px; padding: 0;
      border: none; border-radius: 50%;
      background-color: #a0a0a0; cursor: pointer;
    }
    .carousel-dot.active { background-color: #000; }

    /* ---------- BÀI ĐĂNG ---------- */
    #posts-feed { gap: 0; padding: 0 20px 48px; }

    .post-card {
      flex-shrink: 0;
      padding: 22px 0 24px;
      border-bottom: 1px solid #ececec;
    }
    .post-header { display: flex; align-items: center; gap: 12px; }
    .post-avatar {
      width: 56px; height: 56px; border-radius: 50%;
      object-fit: cover; background-color: #222; flex-shrink: 0;
    }
    .post-head-text { flex: 1; min-width: 0; }
    .post-name {
      display: flex; align-items: center; gap: 6px;
      font-size: 19px; font-weight: 700; line-height: 1.3;
    }
    .post-sub {
      margin-top: 2px;
      display: flex; align-items: center; gap: 6px;
      font-size: 14px; line-height: 1.4; color: var(--gray);
    }
    .tr-btn {
      border: none; background: none; padding: 0;
      font-size: 14px; font-weight: 700; color: var(--ink);
      cursor: pointer;
    }
    .post-more { width: 24px; height: 24px; color: var(--gray); flex-shrink: 0; }
    .post-text {
      margin-top: 16px;
      font-size: 17.5px;
      line-height: 1.6;
      white-space: pre-line;
      word-break: break-word;
    }
    .post-time { margin-top: 14px; font-size: 14px; color: var(--gray); }
  </style>
</head>

  <!-- 1. MÀN HÌNH CHÍNH -->
  <div id="home-screen">
    <img id="home-avatar" class="profile-avatar" src="./media/avatar.png" alt="Avatar" />
    <div class="profile-name">
      <span id="home-name">나는듀로</span>
      <svg class="badge"><use href="#badge"></use></svg>
    </div>

    <div class="menu-list">
      <button class="menu-btn" onclick="openSection('pop')">
        <span class="menu-btn-left">
          <svg class="menu-icon"><use href="#i-pop"></use></svg>
          <span>POP</span>
        </span>
        <svg class="menu-chev"><use href="#i-chev"></use></svg>
      </button>

      <button class="menu-btn" onclick="openSection('posts')">
        <span class="menu-btn-left">
          <svg class="menu-icon"><use href="#i-list"></use></svg>
          <span id="menu-posts-label">from Gen.G</span>
        </span>
        <svg class="menu-chev"><use href="#i-chev"></use></svg>
      </button>
    </div>
  </div>

  <!-- 2. MÀN HÌNH TIN NHẮN POP -->
  <div id="pop-screen" class="app-container">
    <div class="app-header">
      <div class="header-left">
        <button class="icon-btn back" onclick="goHome()" aria-label="Quay lại"><svg><use href="#i-back"></use></svg></button>
      </div>
      <div class="header-title-box">
        <div class="header-title" id="pop-header-name">나는듀로</div>
        <div class="header-subtitle" id="pop-days-together"></div>
      </div>
      <div class="header-right">
        <button class="icon-btn" onclick="toggleSearch('pop')" aria-label="Tìm kiếm"><svg><use href="#i-search"></use></svg></button>
        <button class="icon-btn" onclick="toggleTranslation()" aria-label="Bật/tắt bản dịch">文A</button>
      </div>
    </div>

    <div class="search-bar" id="pop-search-bar">
      <div class="search-field">
        <svg><use href="#i-search"></use></svg>
        <input type="text" id="pop-search-input" placeholder="Tìm tin nhắn..." oninput="filterMessages()" />
      </div>
      <button class="icon-btn" onclick="toggleSearch('pop')" aria-label="Đóng">✕</button>
    </div>

    <div class="chat-feed" id="chat-feed"></div>
  </div>

  <!-- 3. MÀN HÌNH BÀI ĐĂNG (FROM GEN.G) -->
  <div id="posts-screen" class="app-container">
    <div class="app-header">
      <div class="header-left">
        <button class="icon-btn back" onclick="goHome()" aria-label="Quay lại"><svg><use href="#i-back"></use></svg></button>
      </div>
      <div class="header-right">
        <!-- Muốn bỏ luôn nút tìm kiếm: xóa nguyên dòng <button> bên dưới -->
        <button class="icon-btn" onclick="toggleSearch('posts')" aria-label="Tìm kiếm"><svg><use href="#i-search"></use></svg></button>
      </div>
    </div>

    <div class="search-bar" id="posts-search-bar">
      <div class="search-field">
        <svg><use href="#i-search"></use></svg>
        <input type="text" id="posts-search-input" placeholder="Tìm bài đăng (tiếng Hàn hoặc tiếng Việt)..." oninput="filterPosts()" />
      </div>
      <button class="icon-btn" onclick="toggleSearch('posts')" aria-label="Đóng">✕</button>
    </div>

    <div class="chat-feed" id="posts-feed"></div>
  </div>

                    "image": "",
                    "video": ""
            }
    ]
    };

    // =========================================================================
    // HÀM TIỆN ÍCH
    // =========================================================================
    const FALLBACK_EXT = ["jpg", "jpeg", "png", "webp", "gif", "JPG", "JPEG", "PNG"];

    function escapeHtml(str) {
      if (!str) return "";
      return String(str)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    // bỏ dấu + chữ thường để tìm kiếm tiếng Việt không cần gõ dấu
    function norm(s) {
      return (s || "").toLowerCase().normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "").replace(/đ/g, "d");
    }

    function normalizeList(field) {
      if (!field) return [];
      return (Array.isArray(field) ? field : [field])
        .filter(s => typeof s === "string" && s.trim() !== "");
    }

    // Ảnh lỗi -> thử đuôi khác (.jpg/.jpeg/.png...), vẫn lỗi thì hiện đường dẫn để bạn biết file nào sai
    function mediaError(el) {
      if (el.tagName === "IMG") {
        const tried = (el.dataset.tried || "").split(",").filter(Boolean);
        const m = (el.getAttribute("src") || "").match(/^(.*)\.([A-Za-z0-9]+)$/);
        if (m) {
          tried.push(m[2]);
          const next = FALLBACK_EXT.find(ext => !tried.includes(ext));
          if (next) {
            el.dataset.tried = tried.join(",");
            el.src = `${m[1]}.${next}`;
            return;
          }
        }
      }
      const path = el.dataset.orig || el.getAttribute("src");
      const failed = document.createElement("div");
      failed.className = "media-slide media-fail" + (el.classList.contains("active") ? " active" : "");
      failed.textContent = "Không tải được: " + path;
      console.warn("Media load failed:", path);
      el.replaceWith(failed);
    }

    function buildMediaHtml(imageField, videoField) {
      const items = normalizeList(imageField).map(src => ({ type: "img", src }))
        .concat(normalizeList(videoField).map(src => ({ type: "video", src })));
      if (items.length === 0) return "";

      const slides = items.map((it, idx) => {
        const cls = "media-slide" + (idx === 0 ? " active" : "");
        const s = escapeHtml(it.src);
        return it.type === "img"
          ? `<img class="${cls}" src="${s}" data-orig="${s}" alt="" loading="lazy" decoding="async" onerror="mediaError(this)">`
          : `<video class="${cls}" src="${s}#t=0.1" data-orig="${s}" controls playsinline preload="metadata" onerror="mediaError(this)"></video>`;
      }).join("");

      let nav = "", dots = "";
      if (items.length > 1) {
        nav =
          `<button class="carousel-btn prev hidden" onclick="moveSlide(this,-1)" aria-label="Ảnh trước"><svg><use href="#i-chev"></use></svg></button>` +
          `<button class="carousel-btn next" onclick="moveSlide(this,1)" aria-label="Ảnh sau"><svg><use href="#i-chev"></use></svg></button>`;
        dots = `<div class="carousel-dots">` +
          items.map((_, i) => `<button class="carousel-dot${i === 0 ? " active" : ""}" onclick="goToSlide(this,${i})" aria-label="Ảnh ${i + 1}"></button>`).join("") +
          `</div>`;
      }

      return `<div class="media-wrap" data-index="0" data-total="${items.length}"><div class="media-box">${slides}${nav}</div>${dots}</div>`;
    }

    function updateCarouselUI(wrapper, newIndex) {
      const total = parseInt(wrapper.dataset.total, 10);
      wrapper.dataset.index = newIndex;
      wrapper.querySelectorAll(".media-slide").forEach((el, i) => {
        el.classList.toggle("active", i === newIndex);
        if (i !== newIndex && el.tagName === "VIDEO") el.pause();
      });
      wrapper.querySelectorAll(".carousel-dot").forEach((d, i) => d.classList.toggle("active", i === newIndex));
      const prev = wrapper.querySelector(".carousel-btn.prev");
      const next = wrapper.querySelector(".carousel-btn.next");
      if (prev) prev.classList.toggle("hidden", newIndex === 0);
      if (next) next.classList.toggle("hidden", newIndex === total - 1);
    }

    function moveSlide(btn, step) {
      const wrapper = btn.closest(".media-wrap");
      const cur = parseInt(wrapper.dataset.index, 10);
      const total = parseInt(wrapper.dataset.total, 10);
      updateCarouselUI(wrapper, Math.max(0, Math.min(total - 1, cur + step)));
    }

    function goToSlide(dot, index) {
      updateCarouselUI(dot.closest(".media-wrap"), index);
    }

    // vuốt ngang trên điện thoại để chuyển ảnh
    let touchX = null, touchWrap = null;
    document.addEventListener("touchstart", e => {
      const w = e.target.closest(".media-wrap");
      touchWrap = w && parseInt(w.dataset.total, 10) > 1 ? w : null;
      touchX = touchWrap ? e.touches[0].clientX : null;
    }, { passive: true });
    document.addEventListener("touchend", e => {
      if (touchX === null || !touchWrap) return;
      const dx = e.changedTouches[0].clientX - touchX;
      if (Math.abs(dx) > 50) {
        const cur = parseInt(touchWrap.dataset.index, 10);
        const total = parseInt(touchWrap.dataset.total, 10);
        updateCarouselUI(touchWrap, Math.max(0, Math.min(total - 1, cur + (dx < 0 ? 1 : -1))));
      }
      touchX = null; touchWrap = null;
    }, { passive: true });

    // =========================================================================
    // ĐIỀU HƯỚNG
    // =========================================================================
    document.getElementById("home-avatar").src = ARCHIVE_DATA.avatarUrl;
    document.getElementById("home-name").textContent = ARCHIVE_DATA.artistName;
    document.getElementById("menu-posts-label").textContent = ARCHIVE_DATA.postsSectionTitle;
    document.getElementById("pop-header-name").textContent = ARCHIVE_DATA.artistName;
    document.getElementById("pop-days-together").textContent = ARCHIVE_DATA.daysTogetherText;

    const allPosts = () => ARCHIVE_DATA.posts.map((post, idx) => ({ post, idx }));

    function openSection(section) {
      document.getElementById("home-screen").style.display = "none";
      if (section === "pop") {
        document.getElementById("pop-screen").style.display = "flex";
        renderMessages(ARCHIVE_DATA.popMessages);
      } else {
        document.body.classList.add("view-posts");
        document.getElementById("posts-screen").style.display = "flex";
        renderPosts(allPosts());
        document.getElementById("posts-feed").scrollTop = 0;
      }
    }

    function goHome() {
      document.body.classList.remove("view-posts");
      document.querySelectorAll("video").forEach(v => v.pause());
      document.getElementById("pop-screen").style.display = "none";
      document.getElementById("posts-screen").style.display = "none";
      document.getElementById("home-screen").style.display = "flex";
    }

    function toggleSearch(type) {
      const bar = document.getElementById(`${type}-search-bar`);
      const input = document.getElementById(`${type}-search-input`);
      if (bar.style.display === "flex") {
        bar.style.display = "none";
        input.value = "";
        type === "pop" ? renderMessages(ARCHIVE_DATA.popMessages) : renderPosts(allPosts());
      } else {
        bar.style.display = "flex";
        input.focus();
      }
    }

    function toggleTranslation() {
      document.body.classList.toggle("show-translations");
    }

    // =========================================================================
    // TIN NHẮN POP
    // =========================================================================
    function renderMessages(messages) {
      const feed = document.getElementById("chat-feed");
      feed.innerHTML = "";
      let lastDate = "";

      messages.forEach(msg => {
        if (msg.date && msg.date !== lastDate) {
          const dateEl = document.createElement("div");
          dateEl.className = "date-divider";
          dateEl.textContent = msg.date;
          feed.appendChild(dateEl);
          lastDate = msg.date;
        }

        const media = buildMediaHtml(msg.image, msg.video);
        const group = document.createElement("div");
        group.className = "msg-group";
        group.innerHTML =
          `<img class="msg-avatar" src="${escapeHtml(ARCHIVE_DATA.avatarUrl)}" alt="">` +
          `<div class="msg-content-col">` +
            `<div class="msg-sender-row">` +
              `<span class="msg-sender-name">${escapeHtml(ARCHIVE_DATA.artistName)}</span>` +
              `<svg class="badge" style="width:15px;height:15px"><use href="#badge"></use></svg>` +
              `<span class="msg-time">${escapeHtml(msg.time)}</span>` +
            `</div>` +
            `<div class="msg-bubble${media ? " has-media" : ""}">` +
              `<div class="msg-text">${escapeHtml(msg.text)}</div>` +
              (msg.translation ? `<div class="msg-translation">${escapeHtml(msg.translation)}</div>` : "") +
              media +
            `</div>` +
          `</div>`;
        feed.appendChild(group);
      });
    }

    function filterMessages() {
      const kw = norm(document.getElementById("pop-search-input").value);
      renderMessages(ARCHIVE_DATA.popMessages.filter(m =>
        norm(m.text).includes(kw) || norm(m.translation).includes(kw)));
    }

    // =========================================================================
    // BÀI ĐĂNG (See translation / Translated · See original)
    // =========================================================================
    function subHtml(post, idx) {
      if (!post.translation) return "";
      return post.showTr
        ? `<span>Translated</span><span>·</span><button class="tr-btn" onclick="toggleTr(${idx})">See original</button>`
        : `<button class="tr-btn" onclick="toggleTr(${idx})">See translation</button>`;
    }

    function toggleTr(idx) {
      const post = ARCHIVE_DATA.posts[idx];
      post.showTr = !post.showTr;
      const card = document.querySelector(`.post-card[data-idx="${idx}"]`);
      if (!card) return;
      card.querySelector(".post-sub").innerHTML = subHtml(post, idx);
      card.querySelector(".post-text").textContent = post.showTr ? post.translation : post.text;
    }

    function renderPosts(list) {
      const feed = document.getElementById("posts-feed");
      feed.innerHTML = "";

      if (list.length === 0) {
        feed.innerHTML = `<div class="empty-note">Không tìm thấy bài đăng nào</div>`;
        return;
      }

      list.forEach(({ post, idx }) => {
        const card = document.createElement("article");
        card.className = "post-card";
        card.dataset.idx = idx;
        card.innerHTML =
          `<div class="post-header">` +
            `<img class="post-avatar" src="${escapeHtml(ARCHIVE_DATA.avatarUrl)}" alt="">` +
            `<div class="post-head-text">` +
              `<div class="post-name">${escapeHtml(ARCHIVE_DATA.artistName)}<svg class="badge gold"><use href="#badge"></use></svg></div>` +
              `<div class="post-sub">${subHtml(post, idx)}</div>` +
            `</div>` +
            `<svg class="post-more" aria-hidden="true"><use href="#i-dots"></use></svg>` +
          `</div>` +
          buildMediaHtml(post.image, post.video) +
          `<div class="post-text">${escapeHtml(post.showTr ? post.translation : post.text)}</div>` +
          `<div class="post-time">${escapeHtml(post.date)}</div>`;
        feed.appendChild(card);
      });
    }

    function filterPosts() {
      const kw = norm(document.getElementById("posts-search-input").value);
      renderPosts(allPosts().filter(({ post }) =>
        norm(post.text).includes(kw) || norm(post.translation).includes(kw)));
    }
  </script>
</body>
</html>
